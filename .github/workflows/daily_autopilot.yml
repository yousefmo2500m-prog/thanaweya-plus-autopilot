name: Thanaweya Plus Daily Autopilot

on:
  schedule:
    # مواعيد احتياطية مبكّرة لتعويض تأخير طابور GitHub مع قفل صارم يمنع النشر الفجري أو المكرر:
    # الصبح (Morning)
    - cron: '17 3 * * *'
    - cron: '47 4 * * *'
    - cron: '23 6 * * *'
    # المغرب (Maghrib)
    - cron: '47 12 * * *'
    - cron: '17 14 * * *'
    - cron: '23 15 * * *'
    # السهرة (Night)
    - cron: '47 16 * * *'
    - cron: '17 18 * * *'
    - cron: '13 19 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'نوع النشرة المراد إرسالها الآن'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - maghrib
          - night
          - tiktok_comment_sync

permissions:
  contents: write

concurrency:
  group: thanaweya-autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine slot & enforce Cairo time windows + idempotency lock
        id: slot
        run: |
          CAIRO_HOUR=$((10#$(TZ=Africa/Cairo date +%H)))
          CAIRO_MIN=$((10#$(TZ=Africa/Cairo date +%M)))
          TODAY_CAIRO=$(TZ=Africa/Cairo date +%Y-%m-%d)
          EVENT_NAME="${{ github.event_name }}"
          INPUT_SLOT="${{ github.event.inputs.slot }}"
          CRON_EXPR="${{ github.event.schedule }}"
          FORCE_MANUAL="false"

          echo "Cairo now: $(TZ=Africa/Cairo date) | event=${EVENT_NAME} | input=${INPUT_SLOT} | cron=${CRON_EXPR}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_SLOT" != "auto" ] && [ -n "$INPUT_SLOT" ]; then
            # تشغيل يدوي صريح لفترة محددة من لوحة GitHub
            SLOT="$INPUT_SLOT"
            FORCE_MANUAL="true"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            # ربط تعبير الكرون مباشرة بالفترة المقصودة حتى لا تتحول المغرب إلى سهرة أبداً!
            case "$CRON_EXPR" in
              "17 3 * * *"|"47 4 * * *"|"23 6 * * *")
                SLOT="morning"
                # مسموح فقط بين 06:00 صباحاً و 01:30 ظهراً بتوقيت القاهرة
                if [ "$CAIRO_HOUR" -lt 6 ] || [ "$CAIRO_HOUR" -ge 14 ]; then
                  echo "Outside Cairo morning window (${CAIRO_HOUR}:${CAIRO_MIN}) — skipping delayed/early cron."
                  echo "skip=true" >> $GITHUB_OUTPUT
                  exit 0
                fi
                ;;
              "47 12 * * *"|"17 14 * * *"|"23 15 * * *")
                SLOT="maghrib"
                # مسموح فقط بين 04:00 عصراً و 08:15 مساءً بتوقيت القاهرة
                if [ "$CAIRO_HOUR" -lt 16 ] || [ "$CAIRO_HOUR" -ge 20 ]; then
                  echo "Outside Cairo maghrib window (${CAIRO_HOUR}:${CAIRO_MIN}) — skipping delayed/early cron."
                  echo "skip=true" >> $GITHUB_OUTPUT
                  exit 0
                fi
                ;;
              *)
                SLOT="night"
                # مسموح فقط بين 08:15 مساءً و 11:55 مساءً بتوقيت القاهرة (ممنوع النشر بعد منتصف الليل نهائياً!)
                if [ "$CAIRO_HOUR" -lt 20 ]; then
                  echo "Outside Cairo night window (${CAIRO_HOUR}:${CAIRO_MIN}) — skipping early/after-midnight cron."
                  echo "skip=true" >> $GITHUB_OUTPUT
                  exit 0
                fi
                ;;
            esac
          else
            # استدعاء خارجي دقيق عبر API (slot=auto من منبّه Make أو Cron خارجي)
            if [ "$CAIRO_HOUR" -lt 6 ]; then
              echo "Cairo quiet hours (00:00-05:59) — skipping auto trigger."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$CAIRO_HOUR" -lt 14 ]; then
              SLOT="morning"
            elif [ "$CAIRO_HOUR" -lt 20 ]; then
              SLOT="maghrib"
            else
              SLOT="night"
            fi
          fi

          LOCK_KEY="${TODAY_CAIRO}|${SLOT}"
          echo "slot=${SLOT}" >> $GITHUB_OUTPUT
          echo "lock_key=${LOCK_KEY}" >> $GITHUB_OUTPUT

          git fetch origin main 2>/dev/null || true
          LOCK_FILE="published_slots.log"
          if [ -f "thanaweya-autopilot/published_slots.log" ]; then
            LOCK_FILE="thanaweya-autopilot/published_slots.log"
          fi

          if [ "$FORCE_MANUAL" != "true" ] && grep -Fxq "${LOCK_KEY}" "$LOCK_FILE" 2>/dev/null; then
            echo "Already published ${LOCK_KEY} today — skipping without re-posting."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Proceeding to publish ${LOCK_KEY} (force_manual=${FORCE_MANUAL})"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.11 (with pip cache)
        if: steps.slot.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Arabic shaping library (libraqm0) & FFmpeg
        if: steps.slot.outputs.skip != 'true' && steps.slot.outputs.slot != 'tiktok_comment_sync'
        run: |
          if ! dpkg -s libraqm0 >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ffmpeg libraqm0 libharfbuzz0b libfribidi0
          fi

      - name: Install Python dependencies
        if: steps.slot.outputs.skip != 'true'
        run: |
          REQ_FILE="requirements.txt"
          if [ -f "thanaweya-autopilot/requirements.txt" ]; then
            REQ_FILE="thanaweya-autopilot/requirements.txt"
          fi
          pip install -r "$REQ_FILE"

      - name: Stage curriculum cards & 30fps video (nothing published yet)
        if: steps.slot.outputs.skip != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: |
          APP_DIR="."
          if [ -f "thanaweya-autopilot/autopilot.py" ]; then
            APP_DIR="thanaweya-autopilot"
          fi
          python "$APP_DIR/autopilot.py" \
            --slot "${{ steps.slot.outputs.slot }}" \
            --out-dir /tmp/autopilot_out \
            --cdn-base "__CDN_BASE__" \
            --stage-only

      - name: Stage media to media-cdn & verify jsDelivr HTTP 200 before firing platforms
        if: steps.slot.outputs.skip != 'true' && steps.slot.outputs.slot != 'tiktok_comment_sync'
        env:
          REPO: ${{ github.repository }}
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir -p /tmp/prev_cdn /tmp/media_cdn/latest

          if git clone --depth 1 --branch media-cdn "$REPO_URL" /tmp/prev_cdn 2>/dev/null; then
            if [ -d "/tmp/prev_cdn/latest" ]; then
              ls -1t /tmp/prev_cdn/latest/* 2>/dev/null | head -n 15 | xargs -r -I{} cp -p "{}" /tmp/media_cdn/latest/
            fi
          fi

          cp -f /tmp/autopilot_out/*.jpg /tmp/media_cdn/latest/ 2>/dev/null || true
          cp -f /tmp/autopilot_out/*.mp4 /tmp/media_cdn/latest/ 2>/dev/null || true

          cd /tmp/media_cdn
          git init -b media-cdn
          git config user.name "thanaweya-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CDN media $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COMMIT_SHA=$(git rev-parse HEAD)
          git push --force "$REPO_URL" media-cdn:media-cdn

          VID_FILE=$(basename $(ls /tmp/autopilot_out/*.mp4 | head -n 1))
          JSDELIVR_BASE="https://cdn.jsdelivr.net/gh/${REPO}@${COMMIT_SHA}/latest"
          RAW_SHA_BASE="https://raw.githubusercontent.com/${REPO}/${COMMIT_SHA}/latest"
          CHOSEN_BASE=""

          echo "Checking jsDelivr CDN: ${JSDELIVR_BASE}/${VID_FILE}"
          for i in $(seq 1 10); do
            CODE=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 10 "${JSDELIVR_BASE}/${VID_FILE}" || echo "000")
            echo "  [Attempt $i] jsDelivr HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              CHOSEN_BASE="$JSDELIVR_BASE"
              break
            fi
            sleep 3
          done

          if [ -z "$CHOSEN_BASE" ]; then
            for i in $(seq 1 8); do
              CODE=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 10 "${RAW_SHA_BASE}/${VID_FILE}" || echo "000")
              if [ "$CODE" = "200" ]; then
                CHOSEN_BASE="$RAW_SHA_BASE"
                break
              fi
              sleep 3
            done
          fi

          if [ -z "$CHOSEN_BASE" ]; then
            echo "::error::تعذر الوصول العام لرابط الفيديو (HTTP 404/403)! تأكد أن مستودع GitHub مضبوط على Public."
            exit 1
          fi

          python3 - << PYEOF
          import json
          p_path = "/tmp/autopilot_out/webhook_payload.json"
          with open(p_path, "r", encoding="utf-8") as f:
              data = json.load(f)
          chosen = "${CHOSEN_BASE}"
          for k, v in list(data.items()):
              if isinstance(v, str) and "__CDN_BASE__" in v:
                  data[k] = v.replace("__CDN_BASE__", chosen)
          with open(p_path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("Staged live video_url ->", data["video_url"])
          PYEOF

      - name: Simultaneous Parallel Blast (TikTok + YouTube + Facebook + Instagram at T=0!)
        if: steps.slot.outputs.skip != 'true' && steps.slot.outputs.slot != 'tiktok_comment_sync'
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          APP_DIR="."
          if [ -f "thanaweya-autopilot/zernio_publisher.py" ]; then
            APP_DIR="thanaweya-autopilot"
          fi
          VID_PATH=$(ls /tmp/autopilot_out/*.mp4 | head -n 1)
          python "$APP_DIR/zernio_publisher.py" \
            --blast \
            --payload /tmp/autopilot_out/webhook_payload.json \
            --video "$VID_PATH"

      - name: Record published slot lock & commented TikTok IDs on main
        if: steps.slot.outputs.skip != 'true' && steps.slot.outputs.slot != 'tiktok_comment_sync'
        run: |
          git config user.name "thanaweya-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LOCK_FILE="published_slots.log"
          TK_LOG_FILE="commented_tiktok_ids.log"
          if [ -f "thanaweya-autopilot/published_slots.log" ]; then
            LOCK_FILE="thanaweya-autopilot/published_slots.log"
            TK_LOG_FILE="thanaweya-autopilot/commented_tiktok_ids.log"
          fi

          # نحتفظ بنسخة مؤقتة من المعرفات الجديدة قبل git pull --rebase
          cp -f "$TK_LOG_FILE" /tmp/tk_ids_new.log 2>/dev/null || touch /tmp/tk_ids_new.log

          git checkout -- "$TK_LOG_FILE" 2>/dev/null || true
          git pull --rebase origin main || true

          touch "$LOCK_FILE" "$TK_LOG_FILE"
          grep -Fxq "${{ steps.slot.outputs.lock_key }}" "$LOCK_FILE" || echo "${{ steps.slot.outputs.lock_key }}" >> "$LOCK_FILE"
          tail -n 60 "$LOCK_FILE" > "${LOCK_FILE}.tmp" && mv "${LOCK_FILE}.tmp" "$LOCK_FILE"

          cat "$TK_LOG_FILE" /tmp/tk_ids_new.log | awk 'NF && !seen[$0]++' | tail -n 80 > "${TK_LOG_FILE}.tmp"
          mv "${TK_LOG_FILE}.tmp" "$TK_LOG_FILE"

          echo "Last run: $(TZ=Africa/Cairo date) | Slot: ${{ steps.slot.outputs.slot }}" > last_run.txt
          git add "$LOCK_FILE" "$TK_LOG_FILE" last_run.txt
          git diff --cached --quiet || git commit -m "Autopilot published: ${{ steps.slot.outputs.lock_key }}"
          git push origin HEAD || true
